<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Plasma Effect - Rust/WASM</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="canvas"
            data-color-a="#ff66ff"
            data-color-b="#ccaacc"></canvas>
    <script type="module">
        import init from './pkg/wasm_plasma_rs.js';
        await init();
    </script>
</body>
</html>
