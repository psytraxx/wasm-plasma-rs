[package]
name = "wasm-plasma-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the Plasma protocol for WebAssembly."
license = "MIT"


[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3.103", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "DomRect",
    "ImageData",
    "MouseEvent",
    "Performance",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
